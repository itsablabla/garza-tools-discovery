[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "garza-tools-discovery"
version = "1.0.0"
description = "Discovery layer for all 28 MCP servers"
requires-python = ">=3.10"
dependencies = ["fastmcp>=2.0.0","pyyaml"]

[project.scripts]
garza-tools-discovery = "garza_tools_discovery.__main__:main"
garza-discovery-v5 = "garza_tools_discovery.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/garza_tools_discovery"]
